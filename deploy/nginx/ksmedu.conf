# =============================================================================
# KSM Education - Nginx site configuration (clean URLs, no ".php")
# -----------------------------------------------------------------------------
# Place this file in /etc/nginx/sites-available/ksmedu.conf and symlink it into
# /etc/nginx/sites-enabled/. It is included from the http{} block, which is why
# the map{} directives below live at the top of the file (map is http-context
# only) and the server{} block comes after them.
#
# Validate with:  nginx -t
# Reload with:    systemctl reload nginx
#
# DESIGN RULES (do not change without re-reading the notes):
#   * Rewrites NEVER touch /services/  -> API contract stays byte-identical.
#   * Rewrites NEVER touch static dirs -> assets/uploads served straight off disk.
#   * try_files is only allowed to hand a *.php path to the FastCGI location via
#     an internal rewrite (`rewrite ... last`). Passing a .php file as the
#     non-last try_files argument would serve PHP *source code* as a static
#     file, so that pattern is deliberately avoided.
#   * Legacy /path/page.php URLs are still served with 200 (no redirect), so
#     bookmarks, old links and any hardcoded path keep working.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Clean URL -> real script map
# -----------------------------------------------------------------------------
# Only needed for pages whose filename does not equal the public URL segment,
# i.e. the legacy "_user" / "_admin" suffixed files. Pages where the filename
# already matches the URL (e.g. /admin/journals -> admin/journals.php) are
# handled by the generic single-segment fallback in @clean_urls.
#
# $clean_php is empty ("") for every URI that is not an explicitly mapped page.
map $uri $clean_php {
    default "";

    # ---- public / user area -------------------------------------------------
    /user/dashboard        /user/dashboard_user.php;
    /user/journals         /user/journals_user.php;
    /user/opinions         /user/opinions_user.php;
    /user/explore_jurnal   /user/explore_jurnal_user.php;
    /user/explore_opini    /user/explore_opini_user.php;
    /user/tentang          /user/tentang_user.php;
    /user/kontak           /user/kontak_user.php;
    /user/login            /user/login_user.php;
    /user/register         /user/register_user.php;
    /user/profile          /user/profil_user.php;   # English alias
    /user/profil           /user/profil_user.php;   # Indonesian alias
    /user/my_journals      /user/my_journals_user.php;
    /user/token_history    /user/token_history_user.php;
    /user/pengaturan       /user/pengaturan_user.php;

    # ---- admin area ---------------------------------------------------------
    /admin/dashboard       /admin/dashboard_admin.php;
    /admin/login           /admin/login_admin.php;
    /admin/explore_jurnal  /admin/explore_jurnal_admin.php;
    /admin/explore_opini   /admin/explore_opini_admin.php;
}


server {
    listen 80;
    listen [::]:80;
    server_name ksmedu.example.com;          # <-- set your real hostname

    # If you terminate TLS here, keep the clean-URL block identical inside the
    # 443 server{} and only redirect http->https from this one.
    root /var/www/ksmedu;
    index index.php index.html;

    # Requirement 10: never expose a directory listing.
    autoindex off;

    charset utf-8;
    client_max_body_size 25m;                # uploads cap 20MB (services/upload.php)

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # -------------------------------------------------------------------------
    # 2. Security headers (mirrors .htaccess -- nothing removed or weakened)
    # -------------------------------------------------------------------------
    # `always` makes them apply to error responses too. add_header inside a
    # nested location resets inherited headers, so every location that adds its
    # own headers below re-declares these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; frame-src 'self' https://accounts.google.com; connect-src 'self' https://accounts.google.com;" always;

    # -------------------------------------------------------------------------
    # 3. Hard blocks (kept from .htaccess)
    # -------------------------------------------------------------------------
    # Hidden files: .env, .git, .htaccess, .vscode ... (deny before any rewrite)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Source / dump / backup artefacts.
    location ~* \.(sql|log|zip|bak|old|orig|tmp|swp|md)$ {
        deny all;
    }

    # Debug/utility leftovers and hacker verification files.
    location ~* ^/(debug_|fix_|list_all_|list_temp_) {
        deny all;
    }
    location ~* ^/google[a-z0-9]+\.html$ {
        deny all;
    }

    # Internal-only directories: never reachable over HTTP.
    location ^~ /database/ { deny all; }
    location ^~ /tools/    { deny all; }

    # -------------------------------------------------------------------------
    # 4. API endpoints - EXCLUDED from every rewrite (Requirement 3)
    # -------------------------------------------------------------------------
    # ^~ wins over the regex locations below, so /services/... is resolved here
    # and never reaches @clean_urls. The URL must stay literally
    # /services/auth_login.php etc. because:
    #   - js/*.js builds endpoints as `${APP_CONFIG.apiBase}/<file>.php`
    #   - the Telegram webhook is registered with an absolute .php URL
    #   - JWT / OTP / wallet / upload clients are external contracts
    # An extension-less alias would create a second URL for the same endpoint
    # (duplicate surface, CORS/CSRF and rate-limit keys drifting apart).
    location ^~ /services/ {
        # Nested dirs (services/admin/, services/comments/) are covered.
        location ~ ^/services/.+\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # <-- match your FPM pool
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 120s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
        # Anything non-.php under /services/ is not a resource.
        return 404;
    }

    # -------------------------------------------------------------------------
    # 5. Uploads: served directly, PHP execution impossible (Requirements 4/5)
    # -------------------------------------------------------------------------
    location ^~ /uploads/ {
        # Same guard as the .htaccess rule: a smuggled .php/.phtml/.phar in the
        # upload dir is refused instead of being handed to FPM.
        location ~* ^/uploads/.*\.(ph(p[345s]?|tml|ar))$ {
            deny all;
        }
        # Direct PDF access must keep working (inline preview in the browser).
        types { application/pdf pdf; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 6. Static assets: never rewritten (Requirement 4)
    # -------------------------------------------------------------------------
    location ^~ /styles/ { try_files $uri =404; expires 7d; access_log off; }
    location ^~ /js/     { try_files $uri =404; expires 7d; access_log off; }
    location ^~ /assets/ { try_files $uri =404; expires 30d; access_log off; }
    location ^~ /images/ { try_files $uri =404; expires 30d; access_log off; }
    location ^~ /css/    { try_files $uri =404; expires 7d; access_log off; }

    location = /favicon.ico { try_files $uri /assets/favicon.ico =404; access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri =404; access_log off; log_not_found off; }

    # Catch-all for asset extensions that live outside those folders.
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|pdf|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # 7. Main router
    # -------------------------------------------------------------------------
    # Order of resolution for e.g. `/user/dashboard?page=2`:
    #   1. $uri as a real file      -> no match
    #   2. $uri as a real directory -> no match (no trailing-slash redirect, so
    #      the relative "../styles/x.css" links in the page keep resolving)
    #   3. @clean_urls              -> internal rewrite to the real script
    # Query strings survive automatically: nginx rewrites only the path part and
    # $args is reattached, so $_GET is untouched (Requirement 6).
    location / {
        try_files $uri $uri/ @clean_urls;
    }

    location @clean_urls {
        # (a) Explicitly mapped legacy-suffixed page.
        #     `last` re-runs location matching so the target hits the FastCGI
        #     location below instead of being served as a static file.
        if ($clean_php != "") {
            rewrite ^ $clean_php last;
        }

        # (b) Same-name page: /admin/journals -> /admin/journals.php.
        #     Restricted to the two page folders and to ONE path segment made of
        #     safe characters, so this can never synthesise a path into
        #     /services/, /uploads/ or a parent directory.
        if ($uri ~ "^/(?:user|admin)/([A-Za-z0-9_-]+)$") {
            rewrite ^(.*)$ $1.php last;
        }

        # (c) Nothing matched -> real 404 (Requirement 8).
        return 404;
    }

    # -------------------------------------------------------------------------
    # 8. PHP execution
    # -------------------------------------------------------------------------
    # Reached either by a legacy /user/page.php request (Requirement 2) or by the
    # internal rewrite from @clean_urls. `try_files $uri =404` guarantees the
    # script exists: a mapped-but-missing file 404s here instead of looping, and
    # PATH_INFO style injection (/x.php/y.jpg) cannot reach FPM.
    # No rewrite writes a .php URL back to the client, and @clean_urls only ever
    # produces paths ending in .php, which this location terminates - so there
    # is no rewrite cycle (Requirement 7).
    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;       # <-- match your FPM pool
        # Apache strips Authorization; FPM needs it passed explicitly for JWT.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 120s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; frame-src 'self' https://accounts.google.com; connect-src 'self' https://accounts.google.com;" always;
    }

    # Static error pages must not be rewritten or 404-looped.
    location = /404.html { internal; }
    location = /500.html { internal; }
}
